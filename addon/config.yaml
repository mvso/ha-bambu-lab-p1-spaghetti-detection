name: "Bambu Lab P1 - Spaghetti Detection Server"
description: "Obico ML server for detection spaghetti"
version: "1.0.1"
slug: "ha_bambu_lab_p1_spaghetti_detection_addon"
init: false
arch:
  - amd64
startup: services
ports:
  3333/tcp: 3333
# There is deliberately no default secret: the add-on will not start until you
# have entered one of your own under Configuration.
options:
  obico_api_secret: null
schema:
  obico_api_secret: password
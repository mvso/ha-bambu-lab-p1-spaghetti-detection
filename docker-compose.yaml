---
# Run from a checkout of this repository, the image is built from ./addon:
#   ML_API_TOKEN=<your own secret> docker compose up -d --build
services:
  ha_bambu_lab_p1_spaghetti_detection:
    build: ./addon
    image: ha_bambu_lab_p1_spaghetti_detection:local
    container_name: ha_bambu_lab_p1_spaghetti_detection
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - 3333:3333/tcp
    environment:
      # No default on purpose. Generate a secret with: openssl rand -hex 32
      - ML_API_TOKEN=${ML_API_TOKEN:?Set ML_API_TOKEN to a secret of your own}
      - TZ=Europe/London
